    --><script>(function(){const teamColors = {"108":["#BA0021","#BA0021"],"109":["#A71930","#A71930"],"110":["#DF4601","#DF4601"],"111":["#BD3039","#BD3039"],"112":["#0E3386","#CC3433"],"113":["#C6011F","#C6011F"],"114":["#E31937","#E31937"],"115":["#8B5EA5","#8B5EA5"],"116":["#FA4616","#FA4616"],"117":["#EB6E1F","#EB6E1F"],"118":["#004687","#BD9B60"],"119":["#005A9C","#005A9C"],"120":["#AB0003","#AB0003"],"121":["#002D72","#FF5910"],"133":["#EFB21E","#EFB21E"],"134":["#FDB827","#FDB827"],"135":["#2F241D","#FFC425"],"136":["#0C2C56","#005C5C"],"137":["#FD5A1E","#FD5A1E"],"138":["#C41E3A","#C41E3A"],"139":["#8FBCE6","#8FBCE6"],"140":["#C0111F","#C0111F"],"141":["#134A8E","#134A8E"],"142":["#D31145","#D31145"],"143":["#E81828","#E81828"],"144":["#CE1141","#CE1141"],"145":["#27251F","#C4CED4"],"146":["#00A3E0","#00A3E0"],"147":["#003087","#C4CED3"],"158":["#FFC52F","#FFC52F"]};
