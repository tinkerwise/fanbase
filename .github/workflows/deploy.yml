name: Build

# CI only builds and smoke-tests. The host firewall (BitNinja) blocks GitHub
# Actions runner IPs, so deploys run locally via `npm run deploy`.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run smoke
